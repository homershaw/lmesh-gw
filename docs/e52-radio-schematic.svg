<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="1100" height="840" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
  <title>E52-900NW22S radio section - minimum circuit for the LMESH gateway and node daughter boards</title>
  <rect width="1100" height="840" fill="#ffffff"/>
  <style>
    .box{fill:#f7f9fb;stroke:#1d2b36;stroke-width:1.6}
    .mod{fill:#eef5ff;stroke:#1d2b36;stroke-width:1.8}
    .w{fill:none;stroke:#1d2b36;stroke-width:1.5}
    .wd{fill:none;stroke:#1d2b36;stroke-width:1.3;stroke-dasharray:5 4}
    .rf{fill:none;stroke:#1f5fbf;stroke-width:3}
    .pwr{fill:none;stroke:#b3261e;stroke-width:1.6}
    .part{fill:#ffffff;stroke:#1d2b36;stroke-width:1.4}
    .t{fill:#1d2b36}.m{fill:#5b6770}.r{fill:#b3261e}.b{fill:#1f5fbf}
    .h{font-weight:bold;font-size:14px}
    .dot{fill:#1d2b36}
  </style>
  <defs>
    <g id="gnd"><line x1="-9" y1="0" x2="9" y2="0" stroke="#1d2b36" stroke-width="1.6"/><line x1="-6" y1="4" x2="6" y2="4" stroke="#1d2b36" stroke-width="1.4"/><line x1="-3" y1="8" x2="3" y2="8" stroke="#1d2b36" stroke-width="1.2"/></g>
    <g id="capv"><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#1d2b36" stroke-width="2"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#1d2b36" stroke-width="2"/></g>
  </defs>

  <text x="20" y="28" class="t h" font-size="17">E52-900NW22S radio section — minimum circuit (shared by gateway and node daughter boards)</text>
  <text x="20" y="46" class="m">Per Ebyte E52-400/900NW22S User Manual v1.4 (pin table p.6, recommended connection p.7, hardware design p.31) + LMESH bring-up lessons</text>

  <!-- ================= U1 E52 ================= -->
  <rect class="mod" x="430" y="120" width="220" height="440" rx="6"/>
  <text x="540" y="112" text-anchor="middle" class="t h">U1  E52-900NW22S</text>
  <text x="560" y="304" text-anchor="middle" class="m">20×14 mm, 30 pads</text>
  <text x="560" y="320" text-anchor="middle" class="m">NC: 3–6, 8, 11, 12,</text>
  <text x="560" y="336" text-anchor="middle" class="m">16, 18–26 (open)</text>
  <!-- left pins -->
  <g class="t">
    <text x="438" y="164">28 VDD</text>
    <text x="438" y="204">27 GND</text>
    <text x="438" y="244">13 GND</text>
    <text x="438" y="284">15 GND</text>
    <text x="438" y="424">17 NRST</text>
    <text x="438" y="464">7 PA0/BOOT</text>
    <text x="438" y="514">29 SWDIO</text>
    <text x="438" y="544">30 SWCLK</text>
    <text x="642" y="164" text-anchor="end">TXD 9</text>
    <text x="642" y="204" text-anchor="end">RXD 10</text>
    <text x="642" y="364" text-anchor="end">PB3 LED2 1</text>
    <text x="642" y="404" text-anchor="end">PB4 TX-IND 2</text>
    <text x="642" y="484" text-anchor="end">ANT 14</text>
  </g>

  <!-- ================= power ================= -->
  <text x="20" y="90" class="t h">Power</text>
  <text x="20" y="164" class="r">+5V_IN</text>
  <line class="pwr" x1="70" y1="160" x2="170" y2="160"/>
  <circle class="dot" cx="95" cy="160" r="3"/><circle class="dot" cx="135" cy="160" r="3"/>
  <!-- TVS -->
  <line class="w" x1="95" y1="160" x2="95" y2="182"/>
  <polygon class="part" points="87,182 103,182 95,196"/><line class="w" x1="85" y1="196" x2="105" y2="196"/>
  <line class="w" x1="95" y1="196" x2="95" y2="214"/><use href="#gnd" x="95" y="214"/>
  <text x="60" y="240" class="t">D1 TVS</text><text x="60" y="254" class="m">e.g. SMAJ5.0A</text>
  <!-- C1 -->
  <line class="w" x1="135" y1="160" x2="135" y2="186"/><use href="#capv" x="135" y="189"/><line class="w" x1="135" y1="192" x2="135" y2="214"/><use href="#gnd" x="135" y="214"/>
  <text x="140" y="240" class="t">C1 10µF</text>
  <!-- LDO -->
  <rect class="part" x="170" y="136" width="90" height="50"/>
  <text x="215" y="155" text-anchor="middle" class="t">U2 LDO 3.3V</text>
  <text x="215" y="170" text-anchor="middle" class="m">≥500 mA</text>
  <text x="174" y="182" class="m" font-size="10">IN/EN</text><text x="256" y="182" text-anchor="end" class="m" font-size="10">OUT</text>
  <line class="w" x1="215" y1="186" x2="215" y2="214"/><use href="#gnd" x="215" y="214"/>
  <text x="150" y="300" class="m">U2 e.g. AP2112K-3.3 (600 mA), EN tied to IN</text>
  <text x="150" y="314" class="m">C3, C4 right at pin 28</text>
  <!-- 3V3 rail -->
  <line class="pwr" x1="260" y1="160" x2="430" y2="160"/>
  <text x="300" y="148" class="r">+3V3_RF</text>
  <circle class="dot" cx="290" cy="160" r="3"/><circle class="dot" cx="340" cy="160" r="3"/><circle class="dot" cx="390" cy="160" r="3"/>
  <line class="w" x1="290" y1="160" x2="290" y2="186"/><use href="#capv" x="290" y="189"/><line class="w" x1="290" y1="192" x2="290" y2="214"/><use href="#gnd" x="290" y="214"/>
  <line class="w" x1="340" y1="160" x2="340" y2="186"/><use href="#capv" x="340" y="189"/><line class="w" x1="340" y1="192" x2="340" y2="214"/><use href="#gnd" x="340" y="214"/>
  <line class="w" x1="390" y1="160" x2="390" y2="186"/><use href="#capv" x="390" y="189"/><line class="w" x1="390" y1="192" x2="390" y2="214"/><use href="#gnd" x="390" y="214"/>
  <text x="270" y="240" class="t">C2</text><text x="270" y="254" class="m">22µF</text><text x="270" y="268" class="m">low-ESR</text>
  <text x="325" y="240" class="t">C3</text><text x="325" y="254" class="m">1µF</text>
  <text x="375" y="240" class="t">C4</text><text x="375" y="254" class="m">100nF</text>
  <!-- GND pins -->
  <polyline class="w" points="430,200 412,200 412,300"/>
  <line class="w" x1="430" y1="240" x2="412" y2="240"/><line class="w" x1="430" y1="280" x2="412" y2="280"/>
  <circle class="dot" cx="412" cy="240" r="3"/><circle class="dot" cx="412" cy="280" r="3"/>
  <use href="#gnd" x="412" y="300"/>

  <!-- ================= reset ================= -->
  <line class="w" x1="430" y1="420" x2="40" y2="420"/>
  <circle class="dot" cx="330" cy="420" r="3"/><circle class="dot" cx="270" cy="420" r="3"/><circle class="dot" cx="200" cy="420" r="3"/>
  <!-- R1 pull-up -->
  <line class="w" x1="330" y1="420" x2="330" y2="400"/><rect class="part" x="324" y="370" width="12" height="30"/><line class="pwr" x1="330" y1="370" x2="330" y2="352"/>
  <text x="340" y="390" class="t">R1 10k</text><text x="304" y="348" class="r">+3V3_RF</text>
  <!-- C5 -->
  <line class="w" x1="270" y1="420" x2="270" y2="438"/><use href="#capv" x="270" y="441"/><line class="w" x1="270" y1="444" x2="270" y2="462"/><use href="#gnd" x="270" y="462"/>
  <text x="280" y="456" class="t">C5 100nF</text>
  <!-- SW1 -->
  <line class="w" x1="200" y1="420" x2="200" y2="436"/>
  <circle class="part" cx="200" cy="440" r="3"/><circle class="part" cx="200" cy="462" r="3"/><line class="w" x1="192" y1="438" x2="208" y2="460" />
  <line class="w" x1="200" y1="465" x2="200" y2="476"/><use href="#gnd" x="200" y="476"/>
  <text x="140" y="456" class="t">SW1</text><text x="140" y="470" class="m">RST</text>
  <text x="40" y="412" class="t">E52_NRST ← MCU GPIO</text>
  <text x="40" y="440" class="m">(open-drain, opt.)</text>

  <!-- ================= boot ================= -->
  <line class="w" x1="430" y1="460" x2="380" y2="460"/>
  <circle class="dot" cx="380" cy="460" r="3"/>
  <line class="w" x1="380" y1="460" x2="380" y2="478"/><rect class="part" x="374" y="478" width="12" height="26"/><line class="pwr" x1="380" y1="504" x2="380" y2="520"/>
  <text x="392" y="496" class="t">R2</text><text x="392" y="510" class="m">10k</text><text x="356" y="534" class="r">+3V3_RF</text>
  <line class="w" x1="380" y1="460" x2="360" y2="460"/>
  <polyline class="w" points="360,460 360,500 330,500"/>
  <rect class="part" x="300" y="494" width="30" height="12"/><text x="300" y="490" class="t">R3 1k</text>
  <polyline class="w" points="300,500 250,500 250,512"/>
  <circle class="part" cx="250" cy="515" r="3"/><circle class="part" cx="250" cy="537" r="3"/><line class="w" x1="242" y1="513" x2="258" y2="535"/>
  <line class="w" x1="250" y1="540" x2="250" y2="552"/><use href="#gnd" x="250" y="552"/>
  <text x="140" y="520" class="t">SW2 BOOT</text><text x="110" y="534" class="m">hold at power-up</text><text x="110" y="548" class="m">= Ebyte bootloader</text>

  <!-- ================= SWD ================= -->
  <line class="wd" x1="430" y1="510" x2="415" y2="510"/><line class="wd" x1="430" y1="540" x2="415" y2="540"/>
  <text x="408" y="574" text-anchor="end" class="m">pins 29/30 → J3 SWD (5-pin, DNP):</text>
  <text x="408" y="588" text-anchor="end" class="m">3V3, SWDIO, SWCLK, NRST, GND</text>

  <!-- ================= UART ================= -->
  <text x="680" y="90" class="t h">UART (3.3 V TTL, 115200 8N1)</text>
  <line class="w" x1="650" y1="160" x2="880" y2="160"/>
  <line class="w" x1="650" y1="200" x2="880" y2="200"/>
  <circle class="dot" cx="700" cy="160" r="3"/><circle class="dot" cx="725" cy="200" r="3"/>
  <rect class="part" x="880" y="154" width="36" height="12"/><rect class="part" x="880" y="194" width="36" height="12"/>
  <line class="w" x1="916" y1="160" x2="935" y2="160"/><line class="w" x1="916" y1="200" x2="935" y2="200"/>
  <text x="880" y="148" class="t">R4 0Ω</text><text x="880" y="226" class="t">R5 0Ω</text>
  <text x="940" y="164" class="t">E52_TXD → MCU RX</text>
  <text x="940" y="204" class="t">E52_RXD ← MCU TX</text>
  <!-- J4 debug header on module side -->
  <polyline class="w" points="700,160 700,250 760,250"/>
  <polyline class="w" points="725,200 725,275 760,275"/>
  <rect class="box" x="760" y="236" width="90" height="76" rx="3"/>
  <text x="768" y="254" class="t">TXD</text><text x="768" y="279" class="t">RXD</text><text x="768" y="304" class="t">GND</text>
  <text x="805" y="230" class="t">J4</text>
  <line class="w" x1="850" y1="300" x2="866" y2="300"/><line class="w" x1="866" y1="300" x2="866" y2="312"/><use href="#gnd" x="866" y="312"/>
  <text x="880" y="254" class="m">USB-UART debug header.</text>
  <text x="880" y="268" class="m">Leave R4/R5 off (or cut) to talk</text>
  <text x="880" y="282" class="m">to the E52 with a PC, like the</text>
  <text x="880" y="296" class="m">TXD/RXD jumpers on Ebyte's -TB.</text>

  <!-- ================= LEDs ================= -->
  <line class="w" x1="650" y1="360" x2="720" y2="360"/>
  <polygon class="part" points="760,352 760,368 735,360"/><line class="w" x1="735" y1="352" x2="735" y2="368"/>
  <line class="w" x1="720" y1="360" x2="735" y2="360"/><line class="w" x1="760" y1="360" x2="790" y2="360"/>
  <rect class="part" x="790" y="354" width="36" height="12"/><line class="pwr" x1="826" y1="360" x2="850" y2="360"/>
  <text x="854" y="364" class="r">+3V3_RF</text>
  <text x="735" y="344" class="t">D2 status</text><text x="790" y="384" class="m">R6 1k</text>
  <line class="w" x1="650" y1="400" x2="720" y2="400"/>
  <circle class="dot" cx="690" cy="400" r="3"/>
  <polygon class="part" points="760,392 760,408 735,400"/><line class="w" x1="735" y1="392" x2="735" y2="408"/>
  <line class="w" x1="720" y1="400" x2="735" y2="400"/><line class="w" x1="760" y1="400" x2="790" y2="400"/>
  <rect class="part" x="790" y="394" width="36" height="12"/><line class="pwr" x1="826" y1="400" x2="850" y2="400"/>
  <text x="854" y="404" class="r">+3V3_RF</text>
  <text x="790" y="424" class="m">R7 1k</text><text x="735" y="424" class="t">D3 TX</text>
  <polyline class="wd" points="690,400 690,440 940,440"/>
  <text x="944" y="436" class="t">E52_TXIND → MCU GPIO</text>
  <text x="944" y="450" class="m">(optional; low while transmitting)</text>
  <text x="870" y="344" class="m">active-low: cathode to pin</text>

  <!-- ================= antenna ================= -->
  <line class="rf" x1="650" y1="480" x2="780" y2="480"/>
  <circle class="dot" cx="740" cy="480" r="3"/>
  <line class="wd" x1="740" y1="480" x2="740" y2="500"/><use href="#capv" x="740" y="503"/><line class="wd" x1="740" y1="506" x2="740" y2="520"/><use href="#gnd" x="740" y="520"/>
  <text x="700" y="546" class="m">C6 DNP (match)</text>
  <rect class="part" x="780" y="474" width="36" height="12"/>
  <text x="780" y="468" class="t">R8 0Ω</text>
  <line class="rf" x1="816" y1="480" x2="880" y2="480"/>
  <circle class="part" cx="892" cy="480" r="12"/><circle class="dot" cx="892" cy="480" r="3"/>
  <line class="w" x1="892" y1="492" x2="892" y2="512"/><use href="#gnd" x="892" y="512"/>
  <text x="912" y="476" class="t">J5 SMA (edge)</text>
  <text x="912" y="492" class="m">915 MHz antenna</text>
  <text x="660" y="592" class="b">pad 14 → J5: 50 Ω CPWG, short, no vias</text>
  <text x="820" y="540" class="m">Using the module's own IPEX → pigtail instead?</text>
  <text x="820" y="554" class="m">Leave R8 off (Ebyte -TB board does the same).</text>

  <!-- ================= notes ================= -->
  <rect class="box" x="20" y="610" width="1060" height="215" rx="6"/>
  <text x="32" y="632" class="t h">Design notes</text>
  <text x="32" y="654" class="t">• VDD 1.8–3.6 V, absolute max 3.6 V; ≥3.3 V needed for full 22 dBm. No LDO inside the module. TX 128 mA peak, RX 14 mA → regulator ≥300 mA, 500 mA+ recommended</text>
  <text x="32" y="670" class="t">  (Ebyte: keep 30 % margin). A separate +3V3_RF regulator keeps TX bursts off the ESP's 3.3 V. Ebyte asks for a 22 µF low-ESR cap + TVS on the supply.</text>
  <text x="32" y="690" class="t">• Layout: nothing but ground copper under the module (no signal/power traces), solid GND plane, stitching vias around ANT; module and antenna feed away from</text>
  <text x="32" y="706" class="t">  DC-DC converters, USB 3.0, and the ESP's own antenna. 50 Ω trace from pad 14 as short as possible. Do not hot-plug the module (ESD-sensitive).</text>
  <text x="32" y="726" class="t">• Logic is 3.3 V only. A 5 V MCU needs level shifting (Ebyte: series 1–5.1 kΩ as a last resort). ESP32-S31/C6/S3/P4 connect directly.</text>
  <text x="32" y="746" class="t">• Ebyte's p.7 drawing labels the PA0 button "11"; the pin table says PA0 = pin 7 (pin 11 is PA4, NC). This drawing follows the table — verify on your footprint.</text>
  <text x="32" y="766" class="t">• Firmware needs only E52_TXD/E52_RXD. E52_NRST lets the ESP hard-reset a stuck module (uart_rst in config). E52_TXIND could give exact TX-done timing.</text>
  <text x="32" y="786" class="t">• Gateway on this board: build with CONFIG_LMGW_E52_USB=n and set the UART GPIOs (Kconfig LMGW_E52_TX/RX_GPIO or the web Radio page).</text>
  <text x="32" y="806" class="t">• Part numbers are examples, not tested picks. Check LDO dropout from your input rail and the TVS standoff voltage against it.</text>
</svg>
