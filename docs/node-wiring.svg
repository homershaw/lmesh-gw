<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
  <title>LMESH field node wiring - XIAO ESP32-C6 + E52-900NW22S + RS-485 (as built and tested)</title>
  <rect width="1000" height="760" fill="#ffffff"/>
  <style>
    .box{fill:#f7f9fb;stroke:#1d2b36;stroke-width:1.6}
    .mod{fill:#eef5ff;stroke:#1d2b36;stroke-width:1.6}
    .w{fill:none;stroke:#1d2b36;stroke-width:1.6}
    .wd{fill:none;stroke:#1d2b36;stroke-width:1.4;stroke-dasharray:5 4}
    .pwr{fill:none;stroke:#b3261e;stroke-width:1.6}
    .gnd{fill:none;stroke:#2f6b2f;stroke-width:1.6}
    .t{fill:#1d2b36}.m{fill:#5b6770}.r{fill:#b3261e}.g{fill:#2f6b2f}
    .h{font-weight:bold;font-size:14px}
    .pin{fill:#1d2b36}
  </style>

  <text x="20" y="28" class="t h" font-size="17">LMESH field node — wiring as built and tested (fw node 0.1.0)</text>
  <text x="20" y="46" class="m">Seeed XIAO ESP32-C6 · Ebyte E52-900NW22S (UART, 115200 8N1) · auto-direction TTL↔RS-485 board · RTU (tested: R4AVA07, unit 1, 9600 8N1)</text>

  <!-- ================= XIAO ESP32-C6 ================= -->
  <rect class="box" x="520" y="100" width="180" height="320" rx="6"/>
  <text x="610" y="92" text-anchor="middle" class="t h">Seeed XIAO ESP32-C6</text>
  <text x="610" y="255" text-anchor="middle" class="m">(top view, USB-C up)</text>
  <text x="610" y="272" text-anchor="middle" class="m">console = USB-Serial-JTAG</text>
  <text x="610" y="289" text-anchor="middle" class="m">Wi-Fi ant: GPIO3=0 (RF sw on)</text>
  <text x="610" y="306" text-anchor="middle" class="m">GPIO14 0=chip 1=U.FL</text>
  <!-- left pins -->
  <g class="pin">
    <circle cx="520" cy="140" r="3"/><circle cx="520" cy="180" r="3"/><circle cx="520" cy="220" r="3"/>
    <circle cx="520" cy="260" r="3"/><circle cx="520" cy="300" r="3"/><circle cx="520" cy="340" r="3"/><circle cx="520" cy="380" r="3"/>
    <circle cx="700" cy="140" r="3"/><circle cx="700" cy="180" r="3"/><circle cx="700" cy="220" r="3"/>
    <circle cx="700" cy="260" r="3"/><circle cx="700" cy="300" r="3"/><circle cx="700" cy="340" r="3"/><circle cx="700" cy="380" r="3"/>
  </g>
  <text x="528" y="144" class="t">D0 GPIO0</text>
  <text x="528" y="184" class="t">D1 GPIO1</text>
  <text x="528" y="224" class="t">D2 GPIO2</text>
  <text x="528" y="264" class="t">D3 GPIO21</text>
  <text x="528" y="304" class="t">D4 GPIO22</text>
  <text x="528" y="344" class="t">D5 GPIO23</text>
  <text x="528" y="384" class="t">D6 GPIO16</text>
  <text x="692" y="144" text-anchor="end" class="t">5V</text>
  <text x="692" y="184" text-anchor="end" class="t">GND</text>
  <text x="692" y="224" text-anchor="end" class="t">3V3</text>
  <text x="692" y="264" text-anchor="end" class="m">D10 GPIO18</text>
  <text x="692" y="304" text-anchor="end" class="m">D9 GPIO20</text>
  <text x="692" y="344" text-anchor="end" class="m">D8 GPIO19</text>
  <text x="692" y="384" text-anchor="end" class="m">D7 GPIO17</text>
  <text x="508" y="144" text-anchor="end" class="m">n/c</text>
  <text x="508" y="184" text-anchor="end" class="m">spare</text>

  <!-- ================= RS-485 board ================= -->
  <rect class="mod" x="170" y="80" width="160" height="160" rx="6"/>
  <text x="250" y="72" text-anchor="middle" class="t h">TTL↔RS-485 (auto-dir)</text>
  <text x="250" y="232" text-anchor="middle" class="m">TXD/RXD LEDs</text>
  <g class="pin"><circle cx="330" cy="100" r="3"/><circle cx="330" cy="140" r="3"/><circle cx="330" cy="180" r="3"/><circle cx="330" cy="210" r="3"/>
    <circle cx="170" cy="120" r="3"/><circle cx="170" cy="160" r="3"/></g>
  <text x="322" y="104" text-anchor="end" class="t">TXD</text>
  <text x="322" y="144" text-anchor="end" class="t">RXD</text>
  <text x="322" y="184" text-anchor="end" class="t">VCC</text>
  <text x="322" y="214" text-anchor="end" class="t">GND</text>
  <text x="178" y="124" class="t">A+</text>
  <text x="178" y="164" class="t">B−</text>

  <!-- D2 -> TXD, D3 -> RXD -->
  <polyline class="w" points="520,220 470,220 470,100 330,100"/>
  <polyline class="w" points="520,260 450,260 450,140 330,140"/>
  <text x="340" y="95" class="t">TX → UART0</text>
  <text x="340" y="135" class="t">RX ← UART0</text>
  <!-- RS-485 power by net label -->
  <line class="pwr" x1="330" y1="180" x2="380" y2="180"/><text x="384" y="184" class="r">+3V3_XIAO</text>
  <line class="gnd" x1="330" y1="210" x2="380" y2="210"/><text x="384" y="214" class="g">GND</text>

  <!-- ================= RTU ================= -->
  <rect class="box" x="20" y="90" width="100" height="120" rx="6"/>
  <text x="70" y="82" text-anchor="middle" class="t h">RTU</text>
  <text x="70" y="196" text-anchor="middle" class="m">Modbus RTU</text>
  <g class="pin"><circle cx="120" cy="120" r="3"/><circle cx="120" cy="160" r="3"/><circle cx="120" cy="190" r="3"/></g>
  <text x="112" y="124" text-anchor="end" class="t">A / D+</text>
  <text x="112" y="164" text-anchor="end" class="t">B / D−</text>
  <line class="w" x1="120" y1="120" x2="170" y2="120"/>
  <line class="w" x1="120" y1="160" x2="170" y2="160"/>
  <polyline class="gnd" points="120,190 145,190 145,260"/><text x="150" y="258" class="g">GND (common, recommended)</text>
  <text x="20" y="232" class="m">120 Ω A–B, far end</text>
  <text x="20" y="246" class="m">(long runs only)</text>

  <!-- ================= E52 ================= -->
  <rect class="mod" x="170" y="290" width="160" height="190" rx="6"/>
  <text x="250" y="282" text-anchor="middle" class="t h">Ebyte E52-900NW22S</text>
  <text x="250" y="458" text-anchor="middle" class="m">mesh router 0x0002–0x7FFF</text>
  <text x="250" y="472" text-anchor="middle" class="m">915.125 MHz · 21.875k · PAN 0x1234</text>
  <g class="pin"><circle cx="330" cy="320" r="3"/><circle cx="330" cy="360" r="3"/><circle cx="330" cy="400" r="3"/><circle cx="330" cy="425" r="3"/><circle cx="330" cy="445" r="3"/><circle cx="170" cy="330" r="3"/></g>
  <text x="322" y="324" text-anchor="end" class="t">RXD (pin 10)</text>
  <text x="322" y="364" text-anchor="end" class="t">TXD (pin 9)</text>
  <text x="322" y="404" text-anchor="end" class="t">NRST (pin 17)</text>
  <text x="322" y="429" text-anchor="end" class="t">VCC</text>
  <text x="322" y="449" text-anchor="end" class="t">GND</text>
  <text x="178" y="334" class="t">ANT</text>
  <!-- antenna -->
  <polyline class="w" points="170,330 110,330 110,300"/>
  <polyline class="w" points="96,300 110,318 124,300 96,300"/>
  <text x="20" y="350" class="t">915 MHz antenna</text>
  <text x="20" y="364" class="m">(IPEX → SMA bulkhead)</text>

  <!-- D4 -> RXD, D5 -> TXD, D6 -> NRST -->
  <polyline class="w" points="520,300 430,300 430,320 330,320"/>
  <polyline class="w" points="520,340 410,340 410,360 330,360"/>
  <polyline class="wd" points="520,380 390,380 390,400 330,400"/>
  <text x="338" y="315" class="t">TX→UART1</text>
  <text x="338" y="355" class="t">RX←UART1</text>
  <text x="338" y="395" class="m">opt.</text>
  <line class="pwr" x1="330" y1="425" x2="380" y2="425"/><text x="384" y="429" class="r">+3V3_RF (≥300 mA peak)</text>
  <line class="gnd" x1="330" y1="445" x2="380" y2="445"/><text x="384" y="449" class="g">GND</text>

  <!-- ================= XIAO power stubs ================= -->
  <line class="pwr" x1="700" y1="140" x2="750" y2="140"/><text x="754" y="144" class="r">+5V (from supply or USB)</text>
  <line class="gnd" x1="700" y1="180" x2="750" y2="180"/><text x="754" y="184" class="g">GND</text>
  <line class="pwr" x1="700" y1="220" x2="750" y2="220"/><text x="754" y="224" class="r">+3V3_XIAO (logic only)</text>

  <!-- ================= power block ================= -->
  <rect class="box" x="560" y="470" width="420" height="150" rx="6"/>
  <text x="570" y="490" class="t h">Power (recommended for the node board)</text>
  <text x="570" y="512" class="t">Site 12/24 V ─► buck ─► +5V ─► XIAO 5V pin</text>
  <text x="570" y="530" class="t">              +5V ─► LDO/buck 3.3 V, ≥500 mA ─► +3V3_RF</text>
  <text x="570" y="548" class="t">+3V3_RF: 100 µF bulk + 100 nF at the E52 VCC pin</text>
  <text x="570" y="566" class="t">All GNDs common: XIAO, E52, RS-485, (RTU COM)</text>
  <text x="570" y="590" class="m">Bench build: E52 dev board on its 18650; jumpers TXD/RXD</text>
  <text x="570" y="604" class="m">removed; GND wire from battery − to XIAO GND.</text>

  <!-- ================= notes ================= -->
  <rect class="box" x="20" y="500" width="520" height="240" rx="6"/>
  <text x="30" y="520" class="t h">Lessons from bring-up</text>
  <text x="30" y="542" class="t">• E52 dev board: pull BOTH TXD/RXD jumpers (they connect the CH340);</text>
  <text x="30" y="558" class="t">  wire to the module side. Wires on both pins of one jumper =</text>
  <text x="30" y="574" class="t">  TX looped to RX → firmware logs "link is an echo".</text>
  <text x="30" y="596" class="t">• No common GND = garbage or no replies. The dev board has no GND</text>
  <text x="30" y="612" class="t">  header; battery − or the micro-USB shell works.</text>
  <text x="30" y="634" class="t">• Don't power the E52 from the XIAO 3V3 pin (22 dBm TX ≈ 110+ mA).</text>
  <text x="30" y="656" class="t">• RS-485 board TXD/RXD naming varies: no reply → swap D2/D3, then A/B.</text>
  <text x="30" y="678" class="t">• C6 has 2 full UARTs, both used (RS-485=UART0, E52=UART1).</text>
  <text x="30" y="694" class="t">  D1 (GPIO1) is free for a DE pin. More ports: see DESIGN.md.</text>
  <text x="30" y="716" class="t">• Opening the C6 USB serial port with DTR/RTS asserted resets it.</text>

  <!-- legend -->
  <line class="w" x1="600" y1="660" x2="640" y2="660"/><text x="646" y="664" class="t">signal</text>
  <line class="wd" x1="710" y1="660" x2="750" y2="660"/><text x="756" y="664" class="t">optional</text>
  <line class="pwr" x1="600" y1="684" x2="640" y2="684"/><text x="646" y="688" class="r">supply</text>
  <line class="gnd" x1="710" y1="684" x2="750" y2="684"/><text x="756" y="688" class="g">ground</text>
  <text x="600" y="716" class="m">E52 pin numbers 9/10/17 per module datasheet;</text>
  <text x="600" y="730" class="m">check VCC/GND pad numbers there before layout.</text>
</svg>
