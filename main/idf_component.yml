## esp-mqtt and cJSON moved out of ESP-IDF in v6.0 (S31 needs v6.x).
## On IDF 5.x they are built in and these rules skip them.
dependencies:
  idf: ">=5.3"
  espressif/mqtt:
    version: "*"
    rules:
      - if: "idf_version >=6.0"
  espressif/cjson:
    version: "*"
    rules:
      - if: "idf_version >=6.0"
  ## E52 dev board on the S31 USB-HS (OTG) port: CH340 USB-serial
  espressif/usb_host_ch34x_vcp:
    version: "^2.2.1"
